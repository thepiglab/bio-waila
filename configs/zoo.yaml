    hf_id: "google/medgemma-4b-it"
    mode: "generative"
    gpus: 1
    mem_gb: 64
    max_new_tokens: 384
    enabled: true
    notes: "gated (auto-approve): accept the terms on the model page with the HF_TOKEN account before `waila-zoo prefetch`. Health AI Developer Foundations terms."
