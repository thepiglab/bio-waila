# Model zoo registry (see docs/experiments/zoo.md). One entry per off-the-shelf model scored zero-shot on mmbu-public Pass 2.
#   slug               unique; names runs/zoo/<slug>/ and the Slurm job
#   hf_id              Hugging Face repo (for a LoRA adapter: the adapter repo, with `base` = the model it sits on)
#   mode               generative (image + the official Pass-2 prompt, parse JSON)  |  decision (lettered-option readout per field)
#   readout            decision only: letters (default, next-token letter probabilities)  |  d1 (Liquid system_one choice question)
#   base               LoRA adapters: the base model repo
#   trust_remote_code  only when the model ships its own code
#   dtype              bfloat16 (default) | float16 | float32
#   gpus, mem_gb       Slurm resources (every entry fits one 192 GB GPU in bf16)
#   max_new_tokens     generative: decoding budget (default 384)
#   k_max              decision: options per chunk before a tournament is used (default 26)
#   enabled, reason    enabled: false entries are skipped by prefetch / run / the Slurm submit helper; reason says why
#   notes              licence / gating
models:
