# Named override sets for the batch-composition / target ablations (training_plan.md §2.5). Pass one set to a
# trainer with --set, e.g.  waila-train-clm --config configs/clm_siglip2.yaml --set sampler.mode=uniform
# or on the cluster:        sbatch --export=ALL,TRAINER=clm,CONFIG=configs/clm_siglip2.yaml,SET="sampler.mode=uniform" slurm/train.sbatch
# Compare on held-out datasets (metrics.json → heldout.mean_acc_macro_ds); same seed, same global batch.
sampler:
  hierarchical: [sampler.mode=hierarchical]            # default
  plan_mix:     [sampler.mode=uniform]                 # the manifest's own (planned) mix, no re-weighting
  dataset_sqrt: [sampler.mode=dataset_sqrt]            # the previous default (double-balances)
  flat_classes: [sampler.mode=hierarchical, sampler.tau=0.0]   # every submodality equally often
targets:
  binary_smoothing:    [train.smoothing_mode=uniform]
  hierarchy_smoothing: [train.smoothing_mode=hierarchy]  # default
  cross_field:         [train.cross_field_weight=0.1]
  infonce_binary:      [train.loss=infonce, train.soft_targets=false]   # CLM-LLM only: CLM's original loss
  infonce_graded:      [train.loss=infonce, train.soft_targets=true]
  infonce_graded_xf:   [train.loss=infonce, train.soft_targets=true, train.cross_field_weight=0.5]
curriculum:
  no_ramp:   [train.cand_ramp_frac=0.0]
  ramp_5pct: [train.cand_ramp_frac=0.05]                 # default
jev:                                                     # waila-train-jev; docs/models/baseten_decision_recipe.md
  baseline_v0:  [train.brier=0.0, train.abstain=false, train.paraphrase=false, train.label_smoothing=0.05]
  no_brier:     [train.brier=0.0]
  no_abstain:   [train.abstain=false]
  absent_30pct: [train.absent_p=0.3]
  f4_packed:    [train.formulation=F4]                       # same logits as F2 at init; about 2x fewer tokens
  f4_bidir:     [train.formulation=F4, train.bidirectional=true]
  full_ft:      [model.lora=null, model.full_ft=true, model.dtype=float32, train.mixed_precision=bf16, train.lr=3.0e-6,
                 'train.betas=[0.9, 0.95]']
