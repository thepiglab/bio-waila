[project]
name = "bio-waila"
version = "0.1.0"
description = "WAILA (What Am I Looking At): labeler for the MMBU Pass-2 biomedical-context fields; dataset assembly, metadata auto-labelling, and Jev/CLM-style teacher training"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "pyarrow>=15",
    "numpy>=1.26",
    "pillow>=10.2",
    "tifffile>=2024.2",
    "pydicom>=2.4",
    "nibabel>=5.2",
    "SimpleITK>=2.3",
    "opencv-python-headless>=4.9",
    "remotezip>=0.12",
    "huggingface_hub>=0.24",
    "datasets>=2.20",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "rarfile>=4.2",
    "py7zr>=0.21",
    "imagecodecs>=2024.1",             # compressed TIFF (LZW/ZSTD/JPEG2000 …) for tifffile
    "pylibjpeg>=2.0",                  # compressed DICOM transfer syntaxes for pydicom
    "pylibjpeg-libjpeg>=2.1",
    "pylibjpeg-openjpeg>=2.3",
]

[project.optional-dependencies]
# whole-slide images (needs the OpenSlide C library; openslide-bin bundles it on Linux x86_64)
wsi = ["openslide-python>=1.3", "openslide-bin>=4.0"]
# GPU work: autolabel fallback now, Jev/CLM teachers and the SFT student later
gpu = ["torch>=2.5", "torchvision>=0.20", "transformers>=5.0", "accelerate>=1.0", "peft>=0.15", "timm>=1.0", "pyyaml>=6"]

[project.scripts]
waila-select = "bio_waila.data.select:main"
waila-download = "bio_waila.data.download:main"
waila-metalabel = "bio_waila.data.metalabel:main"
waila-prepare = "bio_waila.data.prepare:main"
waila-eval-set = "bio_waila.data.eval_set:main"
waila-autolabel = "bio_waila.data.autolabel:main"
waila-validate = "bio_waila.data.validate:main"
waila-cache = "bio_waila.data.cache:main"
waila-train-clm = "bio_waila.train.train_clm:main"
waila-train-clm-llm = "bio_waila.train.train_clm_llm:main"
waila-train-jev = "bio_waila.train.train_jev:main"
waila-convert-moondream = "bio_waila.models.moondream_vision:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bio_waila"]

[tool.pytest.ini_options]
testpaths = ["tests"]
