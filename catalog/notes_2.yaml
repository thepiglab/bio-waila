sperm-scd-instance-seg-2026:
  description: 2,000 brightfield images (1920x1080) of sperm chromatin dispersion assay slides from Guadalajara, with 3,743 polygon masks of spermatozoa labelled fragmented or non-fragmented DNA.
spinedl-mouse-spinal-cord:
  description: Confocal images of NeuN/DAPI-stained mouse thoracic spinal cord cross-sections (uninjured, sham and contused) with masks for tissue regions and neuron somas.
