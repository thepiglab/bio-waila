tn5000:
  description: 5,000 B-mode thyroid ultrasound images (3,572 malignant, 1,428 benign) from the Cancer Hospital, CAMS, Beijing, with nodule boxes and FNA-confirmed labels.
topcon-mm-fddm:
  description: Paired colour fundus and swept-source OCT images (Topcon Triton) from Guangdong Provincial Hospital of Integrated Traditional Chinese and Western Medicine, split by patient for disease classification.
