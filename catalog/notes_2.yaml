weighted-ensemble-bio-em-ulm:
  description: Seven 2D electron microscopy segmentation sets (FIB-SEM and TEM of BON tumour cells, Jurkat and primary T cells, B cells) with cytoplasm, nucleus and other labels, from Ulm University.
