shoulder-xray-classification-sysu:
  description: Anterior-posterior shoulder X-rays from Sun Yat-sen Memorial Hospital (Guangzhou) in four categories (Type A1, C1, D1, Others); registry says 841 images, the Kaggle copy holds 1,049 files.
