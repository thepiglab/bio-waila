s-haematobium-eggs-urine-2023:
  description: 12,051 microscopy images (2028x1520) from 103 filtered urine samples with segmentation masks of Schistosoma haematobium eggs, captured with the Schistoscope in Abuja, Nigeria.
scin:
  description: 'Crowdsourced skin condition images from Google Search users in the US (2023): 10,379 images with self-reported demographics, symptoms and Fitzpatrick type, plus dermatologist diagnoses.'
sh-sy5y-neurite-phase-contrast:
  description: Phase-contrast images of SH-SY5Y neuroblastoma cells treated with rosmarinic and retinoic acid under varied conditions, with metadata and an ilastik neurite segmentation project.
