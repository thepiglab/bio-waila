tryp-2023:
  description: Microscopy frames from videos of unstained thick blood smears with YOLO/COCO boxes of Trypanosoma brucei, plus negative images and original videos (4.65 GB).
  samples_note: count unverified; many images are video frames
uci-digital-colposcopy-quality:
  description: 287 colposcopy frames sampled from videos at Hospital Universitario de Caracas (Hinselmann, green filter, Schiller), with cervix/os segmentations and expert quality ratings.
uwf-to-fp-style-transfer-yoo:
