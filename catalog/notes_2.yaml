skin-lesion-yolo-ham-7class-makh:
  description: 9,547 skin lesion images in YOLO format with box-derived polygons for seven HAM10000-style classes; likely HAM10000-derived although not stated.
soop-stroke:
  description: Clinical MRI (T1w, FLAIR, diffusion trace and ADC) of 1,715 acute stroke patients in South Carolina (BIDS), with lesion masks for 1,456 subjects (OpenNeuro ds004889).
